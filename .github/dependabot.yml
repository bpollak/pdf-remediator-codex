version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /services/ocrmypdf-worker
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: /services/ocrmypdf-worker
    schedule:
      interval: monthly
