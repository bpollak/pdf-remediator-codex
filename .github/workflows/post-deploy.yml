name: Post-deploy checks

# Runs after CI succeeds on main.
#
# 1. Deploys that commit to Vercel production with the Vercel CLI, when the
#    VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID repository secrets are
#    set. Without them it relies on Vercel's GitHub integration.
# 2. Waits until production's /api/health reports that exact commit, so a
#    push that never reached production fails loudly.
# 3. Runs the browser suite against the live site (regression, axe checks and
#    the visual walkthrough). Screenshots are uploaded as an artifact and also
#    published to the qa/live-walkthrough branch (overwritten each run), so
#    they can be reviewed from environments that cannot download artifacts.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: post-deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  PRODUCTION_URL: https://pdf-remediator-codex.vercel.app

jobs:
  live:
    name: Deploy and check production
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Deploy to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Vercel secrets are not set; relying on the Vercel GitHub integration to deploy $DEPLOY_SHA."
            exit 0
          fi
          npm ci
          export GITHUB_SHA="$DEPLOY_SHA"
          npx --yes vercel@63.1.2 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@63.1.2 build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@63.1.2 deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Wait for production to serve this commit
        run: |
          expected="${DEPLOY_SHA::7}"
          for i in $(seq 1 60); do
            status=$(curl -sS -o health.json -w '%{http_code}' --max-time 15 "$PRODUCTION_URL/api/health" || echo 000)
            version=$(sed -n 's/.*"version":"\([0-9a-f]*\)".*/\1/p' health.json 2>/dev/null)
            if [ "$version" = "$expected" ]; then
              echo "Production is serving $expected: $(cat health.json)"
              exit 0
            fi
            if [ "$status" = "404" ]; then
              echo "Waiting for $expected (production has no /api/health yet, so it runs a release from before October 28)"
            else
              echo "Waiting for $expected (HTTP $status, production reports '${version:-no version}')"
            fi
            sleep 15
          done
          echo "::error::Production did not start serving $expected within 15 minutes. Add the VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID secrets, or check that the Vercel GitHub integration deploys pushes to main."
          exit 1

      - name: Install browser test dependencies
        run: |
          [ -d node_modules ] || npm ci
          npx playwright install --with-deps chromium
      - name: Browser suite against production
        env:
          LIVE_BASE_URL: ${{ env.PRODUCTION_URL }}
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-walkthrough
          path: test-results/
          retention-days: 14
      - name: Publish screenshots to qa/live-walkthrough
        if: always()
        run: |
          [ -d test-results/walkthrough ] || exit 0
          out=$(mktemp -d)
          cp -r test-results/walkthrough/. "$out/"
          echo "Production checks for ${DEPLOY_SHA} (${{ job.status }}), run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > "$out/README.md"
          cd "$out"
          git init -q -b qa/live-walkthrough
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Live walkthrough for ${DEPLOY_SHA::7}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:qa/live-walkthrough
