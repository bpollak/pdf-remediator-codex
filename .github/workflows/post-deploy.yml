name: Post-deploy checks

# After each push to main: wait until production serves that exact commit
# (proving Vercel deployed it), then run the browser suite against the live
# site, including the axe checks and the visual walkthrough. The walkthrough
# screenshots are uploaded as an artifact and also published to the
# qa/live-walkthrough branch (overwritten on every run), so they can be
# reviewed from environments that cannot download artifacts.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: post-deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  PRODUCTION_URL: https://pdf-remediator-codex.vercel.app

jobs:
  live:
    name: Live production checks
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Wait for production to serve this commit
        run: |
          expected="${GITHUB_SHA::7}"
          for i in $(seq 1 60); do
            body=$(curl -sS --max-time 15 "$PRODUCTION_URL/api/health" || true)
            version=$(echo "$body" | sed -n 's/.*"version":"\([0-9a-f]*\)".*/\1/p')
            if [ "$version" = "$expected" ]; then
              echo "Production is serving $expected: $body"
              exit 0
            fi
            echo "Waiting for $expected (production reports '${version:-unknown}')"
            sleep 15
          done
          echo "::error::Production did not start serving $expected within 15 minutes. Check that the Vercel GitHub integration deployed this push."
          exit 1
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser suite against production
        env:
          LIVE_BASE_URL: ${{ env.PRODUCTION_URL }}
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-walkthrough
          path: test-results/
          retention-days: 14
      - name: Publish screenshots to qa/live-walkthrough
        if: always()
        run: |
          [ -d test-results/walkthrough ] || exit 0
          out=$(mktemp -d)
          cp -r test-results/walkthrough/. "$out/"
          echo "Production checks for ${GITHUB_SHA} (${{ job.status }}), run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > "$out/README.md"
          cd "$out"
          git init -q -b qa/live-walkthrough
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Live walkthrough for ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:qa/live-walkthrough
